<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Simple & Effective</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="max-w-800 mx-auto">
            <!-- Header -->
            <header class="text-center mb-4">
                <h1 class="display-4 fw-bold text-primary mb-2">
                    <i class="bi bi-check2-square me-2"></i>Todo App
                </h1>
                <p class="lead text-muted mb-4">Simple. Fast. Effective.</p>
            </header>

            <!-- Main Card -->
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-plus-circle me-2"></i>Add New Task
                    </h5>
                </div>
                
                <div class="card-body">
                    <!-- Add Todo Form -->
                    <form id="addTodoForm" class="mb-4">
                        <div class="input-group">
                            <textarea 
                                id="todoText" 
                                class="form-control form-control-lg" 
                                placeholder="What needs to be done?..." 
                                rows="1"
                                maxlength="200"
                                required
                                autofocus
                            ></textarea>
                            <button type="submit" class="btn btn-primary btn-lg px-4">
                                <i class="bi bi-send me-1"></i> Add
                            </button>
                        </div>
                        <div class="form-text text-muted text-end">Press Enter to add</div>
                    </form>

                    <!-- Toggle Button -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="fw-semibold text-muted">
                            <span id="todoCount">0 tasks</span>
                            <span id="completedCount" class="text-success ms-2"></span>
                        </div>
                        <button id="toggleTodosBtn" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-eye me-1"></i> <span id="toggleText">Hide Todos</span>
                        </button>
                    </div>

                    <!-- Todo List -->
                    <div id="todoListContainer" class="todo-list">
                        <div id="todoList" class="list-group list-group-flush"></div>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="text-center py-5 text-muted" style="display: none;">
                            <i class="bi bi-inbox fs-1 mb-3"></i>
                            <h5>No tasks yet</h5>
                            <p class="mb-0">Add your first task above!</p>
                        </div>
                    </div>

                    <!-- Bulk Actions -->
                    <div class="mt-3 d-flex gap-2">
                        <button id="clearCompletedBtn" class="btn btn-sm btn-outline-danger flex-fill">
                            <i class="bi bi-trash me-1"></i> Clear Completed
                        </button>
                        <button id="clearAllBtn" class="btn btn-sm btn-outline-danger flex-fill">
                            <i class="bi bi-trash-fill me-1"></i> Clear All
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="text-center mt-4 text-muted small">
                <p>Your todos are saved locally in your browser</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
