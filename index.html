<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todo App - Organize your tasks efficiently">
    <meta name="keywords" content="todo, tasks, productivity, organization">
    <title>Todo App - Organize Your Tasks</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/uuid@9.0.1/dist/umd/uuidv4.min.js"></script>
</head>

<body class="p-3 bg-light">
    <div class="container-fluid">
        <header class="mb-4 text-center">
            <h1 class="display-4 fw-bold text-primary">Todo App</h1>
            <p class="lead text-muted">Organize your tasks efficiently</p>
        </header>

        <!-- Success/Error Alerts -->
        <div id="alert-container" class="mb-3"></div>

        <!-- Todo Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-plus-circle me-2"></i>
                    <span id="form-title">Add New Todo</span>
                </h5>
            </div>
            <div class="card-body">
                <form id="addtodo" class="row g-3">
                    <input name="id" type="hidden" />
                    
                    <div class="col-md-6">
                        <label for="text" class="form-label fw-semibold">Task Text <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="text" name="text" rows="2" 
                                  placeholder="Enter your task description..." 
                                  maxlength="500" required></textarea>
                        <div class="form-text text-muted">Maximum 500 characters</div>
                    </div>

                    <div class="col-md-3">
                        <label for="priority" class="form-label fw-semibold">Priority</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="low" selected>Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="category" class="form-label fw-semibold">Category</label>
                        <select class="form-select" id="category" name="category">
                            <option value="personal" selected>Personal</option>
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="shopping">Shopping</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="tags" class="form-label fw-semibold">Tags (comma separated)</label>
                        <input type="text" class="form-control" id="tags" name="tags" 
                               placeholder="e.g., important, weekend, home" />
                    </div>

                    <div class="col-md-3">
                        <label for="dueDate" class="form-label fw-semibold">Due Date</label>
                        <input type="date" class="form-control" id="dueDate" name="dueDate" />
                    </div>

                    <div class="col-md-3">
                        <label for="done" class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch">
                            <input type="checkbox" class="form-check-input" id="done" name="done">
                            <label class="form-check-label" for="done">Already done?</label>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Save
                        </button>
                        <button type="button" id="cancel-btn" class="btn btn-outline-secondary" style="display: none;">
                            <i class="bi bi-x-lg me-1"></i> Cancel
                        </button>
                        <button type="reset" class="btn btn-outline-danger">
                            <i class="bi bi-arrow-clockwise me-1"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="bi bi-search me-2"></i> Search & Filter
                </h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="search" class="form-label">Search</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="search" 
                                   placeholder="Search todos..." />
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-priority" class="form-label">Priority</label>
                        <select class="form-select" id="filter-priority">
                            <option value="">All Priorities</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-category" class="form-label">Category</label>
                        <select class="form-select" id="filter-category">
                            <option value="">All Categories</option>
                            <option value="personal">Personal</option>
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="shopping">Shopping</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-status" class="form-label">Status</label>
                        <select class="form-select" id="filter-status">
                            <option value="">All Statuses</option>
                            <option value="done">Done</option>
                            <option value="pending">Pending</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button id="clear-filters" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-circle me-1"></i> Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Todo List -->
        <div class="card shadow-sm">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-list-task me-2"></i> Your Todos
                </h5>
                <div class="text-muted">
                    <span id="todo-count">0</span> tasks
                    <span id="completed-count" class="text-success ms-2">(0 completed)</span>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center" style="width: 40px;">
                                    <i class="bi bi-check-square"></i>
                                </th>
                                <th>Task</th>
                                <th class="text-center" style="width: 100px;">Priority</th>
                                <th class="text-center" style="width: 100px;">Category</th>
                                <th class="text-center" style="width: 120px;">Due Date</th>
                                <th class="text-center" style="width: 120px;">Tags</th>
                                <th class="text-center" style="width: 100px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="list">
                            <tr class="text-center">
                                <td colspan="7" class="py-4 text-muted">
                                    <i class="bi bi-inbox fs-1 mb-2"></i>
                                    <p>No tasks yet. Add your first todo!</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-light">
                <button id="clear-completed" class="btn btn-sm btn-outline-danger me-2">
                    <i class="bi bi-trash me-1"></i> Clear Completed
                </button>
                <button id="clear-all" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash me-1"></i> Clear All
                </button>
                <button id="export-json" class="btn btn-sm btn-outline-success float-end">
                    <i class="bi bi-download me-1"></i> Export
                </button>
                <button id="import-json" class="btn btn-sm btn-outline-primary float-end me-2">
                    <i class="bi bi-upload me-1"></i> Import
                </button>
                <input type="file" id="import-file" accept=".json" style="display: none;" />
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
