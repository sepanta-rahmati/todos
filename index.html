<html>

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="p-3">
    <h1>Let's do it!</h1>
    <button id="addTodoBtn" class="btn btn-success p-1" onclick="showForm()"><i class="bi bi-plus fs-3"></i></button>
    <form id="addtodo" class="border p-3 d-none">
        <input name="_id" type="hidden" />
        <div class="mb-3">
            <label for="text" class="form-label">Todo Text:</label>
            <textarea class="form-control" id="text" name="text"></textarea>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="done" name="done">
            <label class="form-check-label" for="done">Already done?</label>
        </div>
        <button type="submit" class="btn btn-outline-primary">Submit</button>
        <button type="button" class="btn btn-light" onclick="resetForm(); hideForm()">Cancel</button>
    </form>

    <table class="table table-striped">
        <thead>
            <th class="w-5">Done</th>
            <th>Text</th>
            <th class="w-5">Actions</th>
        </thead>
        <tbody id="list">

        </tbody>
    </table>
    <script src="script.js"></script>
</body>

</html>
